<style>
:root{
  --paper:#f2f4f9;
  --ink:#0f1630;
  --muted:#4d5670;
  --line:#d5dae6;
  --cobalt:#3b4cf0;
  --cobalt-dark:#2b39c4;
  --wa:#17a34a;
  --wa-dark:#12853c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.6}
img{display:block;max-width:100%;height:auto}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* header */
header{padding:20px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:16px}
nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.98rem}
nav a:hover{color:var(--ink)}

/* hero */
.hero{padding:34px 0 64px}
.hero .wrap{display:grid;gap:40px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.35rem,8.2vw,4.4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 20px;max-width:12ch}
.lead{font-size:1.15rem;color:var(--muted);max-width:34em;margin:0 0 28px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:1rem;text-decoration:none;border:2px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:var(--wa-dark)}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-solid{background:var(--cobalt);color:#fff}
.btn-solid:hover{background:var(--cobalt-dark)}
.btn svg{width:20px;height:20px;fill:currentColor}

.shots{display:flex;align-items:flex-start;gap:14px;justify-content:center}
.shot{margin:0;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(15,22,48,.12),0 24px 48px -24px rgba(15,22,48,.45)}
.shot img{width:100%}
.shot-cipher{width:min(46%,260px)}
.shot-pix{width:min(54%,290px);margin-top:56px}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .shot-cipher{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .shot-pix{animation:rise .7s .14s cubic-bezier(.2,.7,.2,1) both}
}

/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 30px}
h3{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}

.project{display:grid;gap:24px;padding:0 0 48px;margin:0 0 48px;border-bottom:1px solid var(--line)}
.project:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
.project p{margin:0 0 14px;max-width:34em;color:var(--muted)}
.project .stack{color:var(--ink);font-weight:500;font-size:.98rem}
.project .shot{max-width:290px}
.status{display:inline-block;font-weight:600;font-size:.9rem;color:var(--cobalt-dark);background:#e2e6ff;border-radius:999px;padding:3px 12px;margin-bottom:12px}

/* services */
.services{list-style:none;margin:0;padding:0;display:grid;gap:0}
.services li{display:grid;gap:4px;padding:20px 0;border-bottom:1px solid var(--line)}
.services li:first-child{padding-top:0}
.services li:last-child{border-bottom:0}
.services strong{font-family:var(--display);font-size:1.3rem;font-weight:700}
.services span{color:var(--muted);max-width:40em}

/* skills */
.skills{display:grid;gap:18px;margin:0}
.skills div{display:grid;gap:2px}
.skills dt{font-weight:600}
.skills dd{margin:0;color:var(--muted)}

/* contact */
.contact{background:var(--ink);color:#fff;border-top:0}
.contact h2{color:#fff}
.contact p{color:#b9c0d8;max-width:32em;margin:0 0 26px}
.contact a{color:#fff}
.links{display:flex;flex-wrap:wrap;gap:8px 26px;margin:30px 0 0;padding:0;list-style:none}
.links a{font-weight:500;text-underline-offset:4px}
.contact :focus-visible{outline-color:#fff}
footer{background:var(--ink);color:#8d95b3;padding:0 0 32px;font-size:.92rem}

@media (min-width:860px){
  .hero{padding:56px 0 88px}
  .hero .wrap{grid-template-columns:1.1fr .9fr;align-items:center;gap:56px}
  .shots{justify-content:flex-end}
  .project{grid-template-columns:1fr 1fr;align-items:center;gap:56px}
  .project.flip .shot{order:2;justify-self:end}
  .services li{grid-template-columns:260px 1fr;gap:32px;align-items:baseline}
  .skills div{grid-template-columns:260px 1fr;gap:32px}
  section{padding:80px 0}
}
</style>
